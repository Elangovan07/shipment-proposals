<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pricing Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<script>
fetch("/api/auth/check").then(res => { if (!res.ok) window.location.href = "/pages/login.html"; });
</script>

<!-- ...same head, CSS, etc... -->
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>💰 Pricing Management</h3>
        <a href="/pages/dashboard.html" class="btn btn-secondary">⬅ Back to Dashboard</a>
    </div>

    <table id="pricingTable" class="table table-striped table-bordered table-sm" style="width:100%">
        <thead class="table-dark">
            <tr>
                <th>Port Loading</th>
                <th>Port Discharge</th>
                <th>Freight Price</th>
                <th>Freight Currency</th>
                <th>Container Size</th>
                <th>House DO Fees</th>
                <th>Validity Date</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <div class="mb-3">
        <button id="saveAllBtn" class="btn btn-primary">💾 Save All Changes</button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script>
$(document).ready(function() {
    let table = $('#pricingTable').DataTable({
        ajax: {
            url: '/api/pricing',
            dataSrc: ''
        },
        columns: [
            { data: 'port_loading' },
            { data: 'port_discharge' },
            { 
                data: 'price',
                render: d => `<input type="text" step="0.01" value="${d || ''}" class="form-control price-input">`
            },
            { 
                data: 'currency',
                render: d => `<input type="text" value="$" class="form-control currency-input">`
            },
            { 
                data: 'container_size',
                render: d => `<input type="text" value="${d || ''}" class="form-control container-size-input">`
            },
            { 
                data: 'house_do_fees',
                render: d => `<input type="text" step="0.01" value="${d || ''}" class="form-control house-do-input">`
            },
            { 
                data: 'validity_date',
                render: d => `<input type="date" value="${d ? d.split('T')[0] : ''}" class="form-control validity-date-input">`
            }
        ]
    });

    $('#saveAllBtn').on('click', function() {
    let updates = [];

    // Loop through all rows in DataTable (all pages)
    table.rows().every(function() {
        const row = this.node();
        const rowData = this.data();

        updates.push({
            port_loading: rowData.port_loading,
            port_discharge: rowData.port_discharge,
            price: $(row).find('.price-input').val(),
            currency: $(row).find('.currency-input').val(),
            container_size: $(row).find('.container-size-input').val(),
            house_do_fees: $(row).find('.house-do-input').val(),
            validity_date: $(row).find('.validity-date-input').val()
        });
    });

    fetch('/api/pricing/update-all', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ updates })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            alert("✅ All changes saved successfully.");
            table.ajax.reload(null, false);
        } else {
            alert("❌ Failed to save changes.");
        }
    })
    .catch(err => {
        console.error(err);
        alert("⚠ Error saving all changes.");
    });
});

});
</script>

</body>
</html>
