<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 480px;">
  <h3 class="mb-4">Forgot Password</h3>

  <div id="step1">
    <label for="emailInput" class="form-label">Enter your registered email</label>
    <input type="email" id="emailInput" class="form-control mb-3" placeholder="Email" required />
    <button class="btn btn-primary w-100" id="sendOtpBtn">Send OTP</button>
  </div>

  <div id="step2" style="display:none;">
    <label for="otpInput" class="form-label">Enter OTP</label>
    <input type="text" id="otpInput" class="form-control mb-3" placeholder="6-digit OTP" maxlength="6" required />

    <label for="newPassword" class="form-label">New Password</label>
    <input type="password" id="newPassword" class="form-control mb-3" placeholder="New password" required />

    <label for="confirmPassword" class="form-label">Confirm Password</label>
    <input type="password" id="confirmPassword" class="form-control mb-4" placeholder="Confirm password" required />

    <button class="btn btn-success w-100" id="resetPasswordBtn">Reset Password</button>
  </div>

  <div id="messageBox" class="mt-3"></div>
</div>

<script>
  let userId = null;

  document.getElementById('sendOtpBtn').addEventListener('click', async () => {
    const email = document.getElementById('emailInput').value.trim();
    if (!email) {
      showMessage('Please enter your email', 'danger');
      return;
    }
    try {
      const res = await fetch('/api/auth/request-reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
        credentials: 'include'
      });
      const data = await res.json();
      if (data.success) {
        userId = data.userId; // Store for password reset step
        showMessage('OTP sent to your email.', 'success');
        // Show step 2, hide step 1
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
      } else {
        showMessage(data.message || 'Failed to send OTP', 'danger');
      }
    } catch (error) {
      showMessage('Error sending OTP. Try again later.', 'danger');
    }
  });

  document.getElementById('resetPasswordBtn').addEventListener('click', async () => {
    const otp = document.getElementById('otpInput').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!otp || !newPassword || !confirmPassword) {
      showMessage('All fields are required', 'danger');
      return;
    }
    if (newPassword !== confirmPassword) {
      showMessage('Passwords do not match', 'danger');
      return;
    }
    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, otp, newPassword }),
        credentials: 'include'
      });
      const data = await res.json();
      if (data.success) {
        showMessage('Password reset successful. Redirecting to login...', 'success');
        setTimeout(() => window.location.href = '/pages/login.html', 3000);
      } else {
        showMessage(data.message || 'Failed to reset password', 'danger');
      }
    } catch (error) {
      showMessage('Error resetting password. Try again later.', 'danger');
    }
  });

  function showMessage(message, type = 'info') {
    const box = document.getElementById('messageBox');
    box.innerHTML = `<div class="alert alert-${type}" role="alert">${message}</div>`;
  }
</script>

</body>
</html>
