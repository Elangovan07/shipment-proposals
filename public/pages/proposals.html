<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Send Proposals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>📧 Send Proposals</h3>
    <a href="/pages/dashboard.html" class="btn btn-secondary">⬅ Back</a>
  </div>

  <div class="alert alert-info">
    These proposals use your latest saved email template with <code>{{shipments_table}}</code> for the shipments list.
  </div>

  <button id="sendBtn" class="btn btn-success mb-3">🚀 Send All Proposals</button>

  <div id="preview-container"></div>
</div>

<script>
let previewsData = []; // Stores the previews returned by backend

function renderPreviews() {
  document.getElementById('preview-container').innerHTML = previewsData.map((p, index) => `
    <div class="card mb-4" data-index="${index}">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <span>${p.company_name} — ${p.contact_name || ''} — ${p.contact_email || ''}</span>
        <button type="button" class="btn btn-sm btn-danger remove-btn">Remove</button>
      </div>
      <div class="card-body">${p.preview_html}</div>
    </div>
  `).join('');
}

function loadPreviews() {
  fetch('/api/proposals/preview')
    .then(res => res.json())
    .then(data => {
      if (!data.success) {
        document.getElementById('preview-container').innerHTML =
          `<div class="alert alert-danger">${data.message}</div>`;
        return;
      }
      previewsData = data.previews;  // Save data in array
      renderPreviews();
    });
}

// Handle remove click
document.getElementById('preview-container').addEventListener('click', function(e) {
  if (e.target.classList.contains('remove-btn')) {
    const card = e.target.closest('.card');
    const index = parseInt(card.getAttribute('data-index'), 10);
    previewsData.splice(index, 1);  // Remove from array
    renderPreviews(); // Re-render previews
  }
});

// Send proposals (only remaining)
document.getElementById('sendBtn').addEventListener('click', () => {
  if (previewsData.length === 0) {
    alert('No companies selected to send!');
    return;
  }
  if (!confirm('Send proposals to selected companies?')) return;

  fetch('/api/proposals/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    // Send only remaining companies to backend
    body: JSON.stringify({ selected_companies: previewsData })
  })
    .then(res => res.json())
    .then(data => alert(data.message))
    .then(loadPreviews);
});

loadPreviews();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
