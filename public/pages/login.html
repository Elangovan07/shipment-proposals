<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Login (OTP)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4 col-lg-3">
      <div class="card shadow p-4">
        <h4 class="mb-3 text-center">Admin Login (OTP)</h4>
        <div id="alertBox"></div>
        <!-- Step 1: Email Input -->
        <form id="step1">
          <div class="mb-3">
            <label class="form-label">Registered Email</label>
            <input type="email" id="emailInput" class="form-control" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Send OTP</button>
        </form>
        <!-- Step 2: OTP Input -->
        <form id="step2" style="display:none;">
          <div class="mb-3">
            <label class="form-label">OTP</label>
            <input type="text" id="otpInput" class="form-control" maxlength="6" required />
          </div>
          <button type="submit" class="btn btn-success w-100">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
let userId = null;

const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const alertBox = document.getElementById("alertBox");

// Step 1: Request OTP
step1.addEventListener("submit", async function(e) {
  e.preventDefault();
  const email = document.getElementById('emailInput').value.trim();
  if (!email) return showAlert("Please enter your email");

  const res = await fetch("/api/auth/request-login-otp", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email })
  });
  const data = await res.json();
  if (res.ok && data.success) {
    showAlert("OTP sent to your email", "success");
    userId = data.userId;
    step1.style.display = "none";
    step2.style.display = "block";
  } else {
    showAlert(data.message || "Error", "danger");
  }
});

// Step 2: Verify OTP
step2.addEventListener("submit", async function(e) {
  e.preventDefault();
  const otp = document.getElementById('otpInput').value.trim();
  if (!otp || !userId) return showAlert("Please enter the OTP");

  const res = await fetch("/api/auth/verify-login-otp", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ userId, otp })
  });
  const data = await res.json();
  if (res.ok && data.success) {
    showAlert("Login successful! Redirecting...", "success");
    setTimeout(()=>window.location.href="/pages/dashboard.html", 800);
  } else {
    showAlert(data.message || "Error", "danger");
  }
});

function showAlert(msg, type="info") {
  alertBox.innerHTML = `<div class="alert alert-${type} mb-2">${msg}</div>`;
}
</script>

</body>
</html>
