<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<div style="margin-bottom: 20px;" class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>📦 Shipments Dashboard</h3>
    <div>
      <input type="file" id="excelFile" accept=".xlsx,.xls" class="form-control d-inline-block" style="width:220px;" />
      <button onclick="uploadExcel()" class="btn btn-success ms-2">📤 Upload Excel</button>
    </div>
    <button onclick="logout()" class="btn btn-danger">Logout</button>
  </div>

  <h5>All Shipments</h5>
  <table id="shipmentsTable" class="table table-striped table-bordered table-sm mb-4">
    <thead class="table-dark">
      <tr>
        <th>Company</th>
        <th>Port Loading</th>
        <th>Port Discharge</th>
        <th>Price</th>
        <th>Currency</th>
        <th>Uploaded</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h5>Company Contacts</h5>
  <table id="contactsTable" class="table table-striped table-bordered table-sm mb-4">
    <thead class="table-dark">
      <tr>
        <th>Company</th>
        <th>Contact Name</th>
        <th>Contact Email</th>
        <th>Contact Phone</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <a href="/pages/add_details.html" class="btn btn-primary ms-2">📓 Add Details</a>
  <a href="/pages/pricing.html" class="btn btn-warning ms-2">💰 Manage Pricing</a>
  <a href="/pages/email-template.html" class="btn btn-info ms-2">✉ Email Template</a>
  <a href="/pages/proposals.html" class="btn btn-primary ms-2">📧 Send Proposals</a>
  <a href="/pages/logs.html" class="btn btn-dark ms-2">📓 View Logs</a>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form id="editForm" class="modal-content">
      <div class="modal-header">
        <h5 id="editModalLabel" class="modal-title">Edit Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div id="editFormBody" class="modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </div>
    </form>
  </div>
</div>

<!-- SCRIPTS: ORDER IS CRITICAL! -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
fetch("/api/auth/check")
  .then(res => { if (!res.ok) window.location.href = "/pages/login.html"; });

function cleanupModalsAndBackdrops() {
  $('.modal-backdrop').remove();
  $('body').removeClass('modal-open');
}

let currentEditType = null;
let currentEditId = null;

$(document).ready(function() {
  cleanupModalsAndBackdrops();

  // DataTables - SHIPMENTS
  const shipmentTable = $('#shipmentsTable').DataTable({
    ajax: {
      url: '/api/shipments',
      dataSrc: ''
    },
    columns: [
      { data: 'company_name' },
      { data: 'port_loading' },
      { data: 'port_discharge' },
      { data: 'price', render: d => d ? d : '<span class="text-danger fw-bold">Missing</span>' },
      { data: 'currency' },
      { data: 'uploaded_at' },
      {
        data: null,
        orderable: false,
        render: function(data, type, row) {
          return `
            <button class="btn btn-warning btn-sm" onclick="editShipment(${row.id})">Edit</button>
            <button class="btn btn-danger btn-sm ms-2" onclick="deleteShipment(${row.id})">Delete</button>`;
        }
      }
    ],
    createdRow: function(row, data) {
      if (!data.price) {
        $(row).css('background-color', '#f8d7da');
      }
    }
  });

  // DataTables - CONTACTS
  const contactsTable = $('#contactsTable').DataTable({
    ajax: {
      url: '/api/contacts',
      dataSrc: ''
    },
    columns: [
      { data: 'company_name' },
      { data: 'contact_name' },
      { data: 'contact_email' },
      { data: 'contact_phone' },
      {
        data: null,
        orderable: false,
        render: function(data, type, row) {
          return `
            <button class="btn btn-warning btn-sm" onclick="editContact(${row.id})">Edit</button>
            <button class="btn btn-danger btn-sm ms-2" onclick="deleteContact(${row.id})">Delete</button>`;
        }
      }
    ]
  });

  // Modal form submit - handles both Shipments and Contacts
  $('#editForm').on('submit', function(e) {
    e.preventDefault();
    const formData = {};
    $(this).find('input').each(function() {
      formData[this.name] = this.value;
    });

    let url, method = 'PUT';
    if (currentEditType === 'shipment') url = `/api/shipments/${currentEditId}`;
    else if (currentEditType === 'contact') url = `/api/contacts/${currentEditId}`;
    else return;

    fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData)
    })
    .then(res => res.json())
    .then(data => {
      if(data.success) {
        if(currentEditType === 'shipment') shipmentTable.ajax.reload();
        else contactsTable.ajax.reload();
        bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
        cleanupModalsAndBackdrops();
      } else {
        alert('Update failed');
      }
    });
  });
});

function logout() {
  cleanupModalsAndBackdrops();
  fetch("/api/auth/logout", { method: "POST" })
    .then(() => window.location.href = "/pages/login.html");
}

function editShipment(id) {
  currentEditType = 'shipment'; currentEditId = id;
  const row = $('#shipmentsTable').DataTable().rows().data().toArray().find(x => x.id == id);
  if (!row) return alert('Row not found');
  $('#editFormBody').html(`
    <div class="mb-2"><label>Port Loading</label><input type="text" name="port_loading" class="form-control" required value="${row.port_loading || ''}" /></div>
    <div class="mb-2"><label>Port Discharge</label><input type="text" name="port_discharge" class="form-control" required value="${row.port_discharge || ''}" /></div>
    <div class="mb-2"><label>Price</label><input type="text" name="price" class="form-control" value="${row.price || ''}" /></div>
    <div class="mb-2"><label>Currency</label><input type="text" name="currency" class="form-control" value="${row.currency || ''}" /></div>
  `);
  $('#editModalLabel').text('Edit Shipment');
  new bootstrap.Modal(document.getElementById('editModal')).show();
}

function editContact(id) {
  currentEditType = 'contact'; currentEditId = id;
  const row = $('#contactsTable').DataTable().rows().data().toArray().find(x => x.id == id);
  if (!row) return alert('Row not found');
  $('#editFormBody').html(`
    <div class="mb-2"><label>Contact Name</label><input type="text" name="contact_name" class="form-control" required value="${row.contact_name || ''}" /></div>
    <div class="mb-2"><label>Contact Email</label><input type="email" name="contact_email" class="form-control" required value="${row.contact_email || ''}" /></div>
    <div class="mb-2"><label>Contact Phone</label><input type="text" name="contact_phone" class="form-control" value="${row.contact_phone || ''}" /></div>
  `);
  $('#editModalLabel').text('Edit Contact');
  new bootstrap.Modal(document.getElementById('editModal')).show();
}

function deleteShipment(id) {
  if(confirm('Delete this shipment?')) {
    fetch(`/api/shipments/${id}`, {method:'DELETE'})
      .then(res => res.json())
      .then(data => {
        if(data.success) $('#shipmentsTable').DataTable().ajax.reload();
        else alert('Delete failed');
      });
  }
}

function deleteContact(id) {
  if(confirm('Delete this contact?')) {
    fetch(`/api/contacts/${id}`, {method:'DELETE'})
      .then(res => res.json())
      .then(data => {
        if(data.success) $('#contactsTable').DataTable().ajax.reload();
        else alert('Delete failed');
      });
  }
}

function uploadExcel() {
  const fileInput = document.getElementById('excelFile');
  if(!fileInput.files.length) {alert("Please choose an Excel file to upload."); return;}
  const formData = new FormData();
  formData.append("file", fileInput.files[0]);
  fetch("/api/upload/excel",{method:"POST",body:formData})
  .then(res => res.json())
  .then(data => {
    if(data.success){
      alert("✅ Upload successful!");
      $('#shipmentsTable').DataTable().ajax.reload();
      $('#contactsTable').DataTable().ajax.reload();
      fileInput.value = "";
    } else alert("❌ Upload failed: "+data.message);
  })
  .catch(() => alert("⚠ Error uploading file."));
}
</script>
</body>
</html>
