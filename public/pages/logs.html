<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Email Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<script>
fetch("/api/auth/check").then(res => { if (!res.ok) window.location.href = "/pages/login.html"; });
</script>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>📓 Email Logs</h3>
        <a href="/pages/dashboard.html" class="btn btn-secondary">⬅ Back to Dashboard</a>
    </div>

    <div class="row mb-2">
        <div class="col-md-3">
            <input type="text" class="form-control" id="companyFilter" placeholder="Filter by Company">
        </div>
        <div class="col-md-3">
            <select class="form-select" id="statusFilter">
                <option value="">All Statuses</option>
                <option value="Sent">Sent</option>
                <option value="Failed">Failed</option>
            </select>
        </div>
        <div class="col-md-3">
            <input type="date" class="form-control" id="fromDate">
        </div>
        <div class="col-md-3">
            <input type="date" class="form-control" id="toDate">
        </div>
    </div>

    <table id="logsTable" class="table table-striped table-bordered table-sm">
  <thead class="table-dark">
    <tr>
      <th>Date/Time</th>
      <th>Company</th>
      <th>Email</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>

<!-- jQuery + DataTables -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function loadLogs() {
    const company = $("#companyFilter").val();
    const status = $("#statusFilter").val();
    const from = $("#fromDate").val();
    const to = $("#toDate").val();

    let url = '/api/logs?';
    if (company) url += `company=${encodeURIComponent(company)}&`;
    if (status) url += `status=${encodeURIComponent(status)}&`;
    if (from) url += `from=${from}&`;
    if (to) url += `to=${to}&`;

    $.get(url, function(data) {
        const table = $("#logsTable").DataTable();
        table.clear();
        data.forEach(row => {
            table.row.add({
                sent_at: row.sent_at,
                company_name: row.company_name,
                contact_email: row.contact_email || '',
                email_status: row.email_status
            });
        });
        table.draw();
    });
}

$(document).ready(function() {
    $("#logsTable").DataTable({
        columns: [
            { data: "sent_at" },
            { data: "company_name" },
            { data: "contact_email" },
            {
                data: "email_status",
                render: data => data === "Sent" 
                  ? '<span class="text-success fw-bold">Sent</span>' 
                  : '<span class="text-danger fw-bold">Failed</span>'
            }
        ]
    });

    loadLogs();
    $("#companyFilter, #statusFilter, #fromDate, #toDate").on("change", loadLogs);
    });
</script>

</body>
</html>
