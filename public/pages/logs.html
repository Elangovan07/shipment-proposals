<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Email Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<script>
  // Redirect to login if not authenticated
  fetch("/api/auth/check").then(res => {
    if (!res.ok) window.location.href = "/pages/login.html";
  });
</script>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>📓 Email Logs</h3>
        <a href="/pages/dashboard.html" class="btn btn-secondary">⬅ Back to Dashboard</a>
    </div>

    <div class="row mb-3">
        <div class="col-md-3">
            <input type="text" class="form-control" id="companyFilter" placeholder="Filter by Company" />
        </div>
        <div class="col-md-3">
            <select class="form-select" id="statusFilter">
                <option value="">All Statuses</option>
                <option value="Sent">Sent</option>
                <option value="Failed">Failed</option>
            </select>
        </div>
        <div class="col-md-3">
            <input type="date" class="form-control" id="fromDate" />
        </div>
        <div class="col-md-3">
            <input type="date" class="form-control" id="toDate" />
        </div>
    </div>

    <button id="resendFailedBtn" class="btn btn-warning mb-3">🔄 Resend All Failed Emails</button>

    <table id="logsTable" class="table table-striped table-bordered table-sm" style="width:100%;">
        <thead class="table-dark">
            <tr>
                <th>Date/Time</th>
                <th>Company</th>
                <th>Email</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- jQuery and DataTables JS -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

<script>
  const resendBtn = document.getElementById('resendFailedBtn');
  let logsTable;

  function getFilters() {
    return {
      company: $("#companyFilter").val(),
      status: $("#statusFilter").val(),
      from: $("#fromDate").val(),
      to: $("#toDate").val()
    };
  }

  function reloadTable() {
    logsTable.ajax.reload();
  }

  $(document).ready(function () {
    logsTable = $('#logsTable').DataTable({
      serverSide: true,
      processing: true,
      ajax: function (data, callback) {
        const filters = getFilters();
        const params = {
          page: (data.start / data.length) + 1,
          pageSize: data.length,
          company: filters.company,
          status: filters.status,
          from: filters.from,
          to: filters.to
        };
        $.get('/api/logs', params, function (response) {
          callback({
            recordsTotal: response.total,
            recordsFiltered: response.total,
            data: response.data
          });
        });
      },
      columns: [
        { data: 'sent_at' },
        { data: 'company_name' },
        { data: 'contact_email' },
        { 
          data: 'email_status',
          render: function (data) {
            return data === 'Sent'
              ? '<span class="text-success fw-bold">Sent</span>'
              : '<span class="text-danger fw-bold">Failed</span>';
          }
        }
      ],
      lengthMenu: [10, 25, 50, 100],
      pageLength: 25,
      order: [[0, 'desc']]
    });

    // Reload table on filter changes
    $('#companyFilter, #statusFilter, #fromDate, #toDate').on('change', reloadTable);
  });

  resendBtn.addEventListener('click', () => {
    if (!confirm('Resend all failed emails for selected filters?')) return;

    resendBtn.disabled = true;
    resendBtn.textContent = 'Resending...';

    const filters = getFilters();
    // Build query string from filters to resend only filtered failed emails
    const queryParams = new URLSearchParams(filters).toString();

    fetch('/api/logs/resend-failed?' + queryParams, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      }
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert(`Successfully resent: ${data.sentCount} emails\nFailed: ${data.failedCount}`);
          reloadTable();
        } else {
          alert('Failed to resend emails: ' + data.message);
        }
      })
      .catch(err => alert('Error resending emails: ' + err.message))
      .finally(() => {
        resendBtn.disabled = false;
        resendBtn.textContent = '🔄 Resend All Failed Emails';
      });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
